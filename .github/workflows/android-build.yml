name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android platform folder (does not touch lib/ or pubspec).
      - name: Create Android project files
        run: flutter create --platforms=android --project-name evinn --org com.evinn .

      - name: Patch Android permissions & SDK
        run: |
          chmod +x scripts/patch_android.sh
          ./scripts/patch_android.sh

      - name: Get packages
        run: flutter pub get

      # versionCode = the CI run number, so in-app auto-update can compare builds.
      - name: Build debug APK
        run: flutter build apk --debug --build-name=0.1.0 --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/evinn-build-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: evinn-debug-apk
          path: build/app/outputs/flutter-apk/evinn-build-${{ github.run_number }}.apk
          if-no-files-found: error

      # Publish a Release with a clean, no-login, tappable download URL,
      # tagged build-<run> so the app's updater can detect newer builds.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EVINN build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: build/app/outputs/flutter-apk/evinn-build-${{ github.run_number }}.apk
