name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate the Android platform folder (does not touch lib/ or pubspec).
      - name: Create Android project files
        run: flutter create --platforms=android --project-name evinn --org com.evinn .

      - name: Patch Android permissions & SDK
        run: |
          chmod +x scripts/patch_android.sh
          ./scripts/patch_android.sh

      # Use a fixed debug keystore so every build has the SAME signature.
      # This is what makes installs-over-previous-builds and in-app auto-update
      # work. These are Android's standard public debug credentials, not secrets.
      - name: Install fixed signing key
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Get packages
        run: flutter pub get

      # Release + split-per-ABI => small APKs (~20MB arm64) that download
      # reliably on mobile, instead of one ~160MB universal debug APK. The
      # Flutter template signs release with the (fixed) debug key, so these
      # share the same signature and still install over / auto-update prior
      # builds. versionCode = CI run number so the updater can compare builds.
      - name: Build APK
        run: flutter build apk --release --split-per-abi --build-name=0.1.0 --build-number=${{ github.run_number }}

      # Primary download = arm64-v8a (virtually all phones since ~2016).
      # Also publish the 32-bit build for very old devices.
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk     evinn-build-${{ github.run_number }}.apk
          cp app-armeabi-v7a-release.apk   evinn-build-${{ github.run_number }}-arm32.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: evinn-apk
          path: build/app/outputs/flutter-apk/evinn-build-${{ github.run_number }}.apk
          if-no-files-found: error

      # Publish a Release with a clean, no-login, tappable download URL,
      # tagged build-<run> so the app's updater can detect newer builds.
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: EVINN build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/evinn-build-${{ github.run_number }}.apk
            build/app/outputs/flutter-apk/evinn-build-${{ github.run_number }}-arm32.apk
